# LiveContainer ProxyChains configuration
# Put this file in one of these places:
#   $HOME/Documents/proxychains.conf
#   $HOME/Library/Preferences/proxychains.conf
#   next to libproxychains_livecontainer.dylib
# Or point PROXYCHAINS_CONF_FILE to it before the dylib is loaded.

strict_chain
# Proxy DNS through the HTTP proxy (keeps DNS inside the tunnel).
# If an app misbehaves, comment this line out and try again.
proxy_dns
tcp_read_time_out 15000
tcp_connect_time_out 8000

# Drop non-TCP traffic (UDP/QUIC/ICMP/raw sockets) instead of letting it
# bypass the HTTP proxy. This forces apps to fall back to TCP, but can break
# UDP-based features such as games, VoIP, or video calls.
# block_non_tcp

# Exclude loopback so local proxies and LiveContainer internals keep working.
localnet 127.0.0.0/255.0.0.0
localnet ::1/128

[ProxyList]
# Replace with your HTTP proxy. Syntax: http <ip-or-host> <port> [user pass]
http 127.0.0.1 8080
