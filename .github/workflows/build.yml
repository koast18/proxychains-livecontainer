name: Build iOS dylib

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode/SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build normal dylib
        run: |
          make clean
          make ARCH=arm64 IOS_DEPLOYMENT_TARGET=15.0

      - name: Build debug dylib
        run: |
          make clean
          make ARCH=arm64 IOS_DEPLOYMENT_TARGET=15.0 DEBUG=1

      - name: Inspect artifacts
        run: |
          ls -lh libproxychains_livecontainer*.dylib
          file libproxychains_livecontainer*.dylib
          lipo -info libproxychains_livecontainer*.dylib || true

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libproxychains_livecontainer.dylib
            libproxychains_livecontainer_debug.dylib
            proxychains.conf
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload artifact (workflow_dispatch / non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: libproxychains_livecontainer-dylibs
          path: |
            libproxychains_livecontainer.dylib
            libproxychains_livecontainer_debug.dylib
            proxychains.conf
